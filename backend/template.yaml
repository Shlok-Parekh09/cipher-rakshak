AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CipherRakshak privacy request workspace
Parameters:
  Origin:
    Type: String
    Default: http://localhost:3000
  Sender:
    Type: String
  DemoRecipient:
    Type: String
  AllowLive:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  ModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
Resources:
  Citizens:
    Type: AWS::Cognito::UserPool
    Properties:
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]
  WebClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref Citizens
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref Origin]
        AllowMethods: [GET, POST, PATCH, OPTIONS]
        AllowHeaders: [Authorization, Content-Type]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 15
        ThrottlingRateLimit: 5
      Auth:
        DefaultAuthorizer: Citizen
        Authorizers:
          Citizen:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${Citizens}'
              audience: [!Ref WebClient]
  Directory:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CipherRakshak_Directory
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: company_id, AttributeType: S}]
      KeySchema: [{AttributeName: company_id, KeyType: HASH}]
  Requests:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: CipherRakshak_Requests
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification: {AttributeName: expires_at, Enabled: true}
      AttributeDefinitions:
        - {AttributeName: request_id, AttributeType: S}
        - {AttributeName: owner, AttributeType: S}
        - {AttributeName: created_at, AttributeType: S}
      KeySchema: [{AttributeName: request_id, KeyType: HASH}]
      GlobalSecondaryIndexes:
        - IndexName: OwnerCreated
          KeySchema:
            - {AttributeName: owner, KeyType: HASH}
            - {AttributeName: created_at, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
  Service:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handler.handler
      Runtime: python3.12
      Timeout: 28
      MemorySize: 512
      Environment:
        Variables:
          DIRECTORY_TABLE: !Ref Directory
          REQUESTS_TABLE: !Ref Requests
          MODEL_ID: !Ref ModelId
          SENDER: !Ref Sender
          DEMO_RECIPIENT: !Ref DemoRecipient
          ALLOW_LIVE: !Ref AllowLive
          ORIGIN: !Ref Origin
      Policies:
        - DynamoDBReadPolicy: {TableName: !Ref Directory}
        - DynamoDBCrudPolicy: {TableName: !Ref Requests}
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${ModelId}'
            - Effect: Allow
              Action: ses:SendRawEmail
              Resource: !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*'
              Condition:
                StringEquals:
                  ses:FromAddress: !Ref Sender
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: '/api/health'
            Auth: {Authorizer: NONE}
        DirectoryList:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: '/api/directory'
            Auth: {Authorizer: NONE}
        Analyze:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: '/api/analyze'
        Dispatch:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: '/api/dispatch'
        ListRequests:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: '/api/requests'
        UpdateRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: PATCH
            Path: '/api/requests/{request_id}'
        Escalate:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: '/api/escalate'
Outputs:
  Endpoint:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  ClientId:
    Value: !Ref WebClient
  PoolId:
    Value: !Ref Citizens
